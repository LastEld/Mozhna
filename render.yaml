# Zero-budget TEST topology. Verify workspace has no payment method before creation:
# Render can bill bandwidth/build overages even when compute uses Free.
services:
  - type: web
    name: mozhna-test
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: bash scripts/render_build.sh
    startCommand: bash scripts/render_start.sh
    healthCheckPath: /healthz
    autoDeployTrigger: off
    maxShutdownDelaySeconds: 30
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: NODE_VERSION
        value: '24'
      - key: MOZHNA_ENV
        value: production
      - key: MOZHNA_PASSWORD
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: mozhna-test-db
          property: connectionString
      - key: MOZHNA_ALLOW_PAID_INFERENCE
        value: 'false'
      - key: MOZHNA_DAILY_JOB_LIMIT
        value: '40'
databases:
  - name: mozhna-test-db
    region: frankfurt
    plan: free
    postgresMajorVersion: '17'
    databaseName: mozhna
    user: mozhna
    ipAllowList: []
